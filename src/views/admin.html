<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" type="text/css" href="/stylesheets/admin.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="sidebar">
      <div class="brand">MKVI</div>
      <nav class="nav">
        <a href="/admin" class="nav-item active">Dashboard</a>
        <a href="/users" class="nav-item">Users</a>
        <a href="/admin/logout" class="nav-item">Logout</a>

      </nav>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <p class="eyebrow">Backend</p>
          <h1>Hello Admin</h1>
        </div>
      </header>

      <section class="cards">
        <article class="card highlight">
          <span class="label">Status</span>
          <strong>System online</strong>
        </article>
        <article class="card">
          <span class="label">Users</span>
          <strong>Manage account data</strong>
        </article>
        <article class="card">
          <span class="label">Overview</span>
          <strong>Admin dashboard ready</strong>
        </article>
      </section>
    </main>
  </div>
</body>

</html>
