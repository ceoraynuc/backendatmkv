<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - MKVI Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .brand {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #111;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="brand">MKVI</div>

        <h1>Forgot Password</h1>

        <p>Enter your admin email to reset your password.</p>

        <form id="forgot-form">

            <div class="form-group">
                <label for="email">Email</label>

                <input id="email" type="email" placeholder="Admin email" required />
            </div>

            <button type="submit">
                Send Reset Link
            </button>

            <div id="message"></div>

        </form>

        <a class="back" href="/admin/login">
            Back to Login
        </a>

    </div>

    <script>

        const form = document.getElementById('forgot-form');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (event) => {

            event.preventDefault();

            message.textContent = '';

            const email = document.getElementById('email').value;

            try {

                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',
                    },

                    body: JSON.stringify({
                        email,
                    }),
                });

                const data = await response.json();

                message.style.color = 'green';

                message.textContent =
                    'If the email exists, a password reset link has been sent.';

            } catch (error) {

                message.textContent =
                    'Something went wrong. Please try again.';

                message.style.color = '#d00';
            }

        });

    </script>

</body>

</html>
