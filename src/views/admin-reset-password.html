<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - MKVI Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .brand {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">MKVI</div>

    <h1>Reset Password</h1>

    <form id="reset-form">

      <div class="form-group">

        <label for="password">
          New Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="New password"
          minlength="8"
          required
        />

      </div>

      <div class="form-group">

        <label for="confirm-password">
          Confirm Password
        </label>

        <input
          id="confirm-password"
          type="password"
          placeholder="Confirm password"
          minlength="8"
          required
        />

      </div>

      <button type="submit">
        Reset Password
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>

    const form = document.getElementById('reset-form');
    const message = document.getElementById('message');

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    form.addEventListener('submit', async (event) => {

      event.preventDefault();

      message.textContent = '';

      if (!token) {
        message.style.color = '#d00';
        message.textContent = 'Reset token is missing.';
        return;
      }

      const password =
        document.getElementById('password').value;

      const confirmPassword =
        document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        message.style.color = '#d00';
        message.textContent = 'Passwords do not match.';
        return;
      }

      try {

        const response = await fetch('/api/auth/reset-password', {

          method: 'POST',

          headers: {
            'Content-Type': 'application/json',
          },

          body: JSON.stringify({
            token,
            newPassword: password,
          }),

        });

        const data = await response.json();

        if (!response.ok) {

          message.style.color = '#d00';

          message.textContent =
            data.error || 'Password reset failed.';

          return;
        }

        message.style.color = 'green';

        message.textContent =
          'Password reset successfully! Redirecting to login...';

        setTimeout(() => {
          window.location.href = '/admin/login';
        }, 1500);

      } catch (error) {

        message.style.color = '#d00';

        message.textContent =
          'Something went wrong. Please try again.';

      }

    });

  </script>

</body>

</html>
